name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      # The host face first: its tsdown pass generates the typert Remote
      # artifacts (lib/typert.remote-client.d.ts) the browser face imports,
      # so a clean checkout must build it before typechecking the client
      # half. build:client then emits the browser bundle.
      - run: pnpm run build:host
      - run: pnpm run typecheck
      - run: pnpm run build:client
      - run: pnpm run test
      # verify inspects the built lib/ artifacts, so it runs after build.
      - run: pnpm run verify
